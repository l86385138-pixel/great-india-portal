<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="auth-wrap">
<section class="card">
<h1>Create account</h1>
<p id="msg" class="message"></p>
<form id="registerForm">
<input id="name" type="text" placeholder="Full name" required>
<input id="mobile" type="tel" placeholder="Mobile number">
<input id="email" type="email" placeholder="Email" required>
<input id="password" type="password" placeholder="Password (6+ characters)" minlength="6" required>
<button class="btn primary" type="submit">Register</button>
</form>
<p class="switch">Already have an account? <a href="login.html">Login</a></p>
</section>
</main>
<script type="module" src="js/auth.js"></script>
</body>
</html>
